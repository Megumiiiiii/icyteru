name: Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    name: Build Preview APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check preview version
        run: |
          set -euo pipefail
          npm run version:check
          git fetch --force --tags origin
          version="$(node -p "require('./package.json').version")"
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n '1p')"
          if [ -n "$latest" ]; then
            released="${latest#v}"
            oldest="$(printf '%s\n%s\n' "$version" "$released" | sort -V | sed -n '1p')"
            if [ "$oldest" != "$released" ]; then
              echo "::error::Preview version $version is older than the latest release $released. Rebase beta onto main or bump the version before building."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      - name: Install the Android SDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip
          SDK="$HOME/android-sdk"
          ARCHIVE="$RUNNER_TEMP/cmdtools.zip"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$ARCHIVE" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $ARCHIVE" | sha1sum -c -
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/cmdtools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          set +e
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null
          sdk_status="${PIPESTATUS[1]}"
          set -o pipefail
          set -e
          if [ "$sdk_status" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$sdk_status"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Validate signing inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set; the signed preview cannot be built."
              exit 1
            fi
          done

      - name: Write the Firebase client config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Decode the Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/icyteru.keystore"
          chmod 600 "$RUNNER_TEMP/icyteru.keystore"

      - name: Build the preview APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/icyteru.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME was not set by the SDK install step."
            exit 1
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          npm run android:apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one preview APK, found ${#apks[@]}."
            exit 1
          fi
          report="$RUNNER_TEMP/apksigner-report.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${apks[0]}" | tee "$report"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$report" | tr '[:upper:]' '[:lower:]')"
          expected="f958052cf0433130271a789a27e628e39d82a8c4b123ddf8c82b16fc4ab317be"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Preview APK was not signed with the expected Icyteru release certificate."
            exit 1
          fi

      - name: Upload preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icyteru-Android-preview
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
