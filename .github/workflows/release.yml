name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Require the tag to match the app version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$RELEASE_TAG" in
            v*) stripped="${RELEASE_TAG#v}" ;;
            *)
              echo "::error::Tag '$RELEASE_TAG' must start with v and match package.json version $version (expected v$version)."
              exit 1
              ;;
          esac
          if [ "$stripped" != "$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $version. Installers are named for $version (for example Icyteru Setup $version.exe), so this release must be tagged v$version. Bump package.json to $stripped and push that commit before tagging, or push the tag v$version instead."
            exit 1
          fi
          echo "Release $RELEASE_TAG matches package.json $version."

  build:
    name: Build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        # Never publish from the builder. A tag checkout makes electron-builder
        # try to upload a GitHub Release, which needs GH_TOKEN and would
        # duplicate the publish job below. That job uses GITHUB_TOKEN.
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: icyteru-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  android:
    name: Build (Android)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android SDK
        # ubuntu-latest already exports ANDROID_SDK_ROOT to /usr/local/lib/android/sdk.
        # Gradle fails if that path and ANDROID_HOME disagree, so this job uses one
        # directory for every variable Gradle consults.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build the debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME was not set by the SDK install step."
            exit 1
          fi
          if [ "$ANDROID_SDK_ROOT" != "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME ($ANDROID_HOME) and ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT) must be the same directory."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          npm run android:apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: icyteru-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Write release notes from commits
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          {
            echo "## What changed"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --reverse --pretty=format:"- %s" "${previous}..${RELEASE_TAG}"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${RELEASE_TAG}"
            else
              git log --no-merges --reverse --pretty=format:"- %s" "${RELEASE_TAG}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: icyteru-*
          path: artifacts
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
