name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Require the tag to match the app version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$RELEASE_TAG" in
            v*) stripped="${RELEASE_TAG#v}" ;;
            *)
              echo "::error::Tag '$RELEASE_TAG' must start with v and match package.json version $version (expected v$version)."
              exit 1
              ;;
          esac
          if [ "$stripped" != "$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $version. Installers are named for $version (for example Icyteru Setup $version.exe), so this release must be tagged v$version. Bump package.json to $stripped and push that commit before tagging, or push the tag v$version instead."
            exit 1
          fi
          echo "Release $RELEASE_TAG matches package.json $version."

      - name: Check derived version files
        run: node scripts/version.mjs check

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis
          - os: macos-latest
            name: macos
            bundles: dmg
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build the Tauri bundles
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/dmg/*.dmg out/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/deb/*.deb out/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/ 2>/dev/null || true
          ls -l out

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: icyteru-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          # The macOS bundle is the largest artifact; installers that matter are
          # release assets, so a single day of retention is plenty.
          retention-days: 1

  android:
    name: Build (Android)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android SDK
        # ubuntu-latest already exports ANDROID_SDK_ROOT to /usr/local/lib/android/sdk.
        # Gradle fails if that path and ANDROID_HOME disagree, so this job uses one
        # directory for every variable Gradle consults.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Write the Firebase client config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set; the Android build cannot initialize Firebase."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Decode the Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; the APK would get a new signing key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/icyteru.keystore
          chmod 600 android/app/icyteru.keystore

      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/icyteru.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME was not set by the SDK install step."
            exit 1
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          npm run android:apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: icyteru-Android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Write release notes from commits
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          notes=""
          if [ -f RELEASE_NOTES.md ]; then
            notes="$(awk -v tag="$RELEASE_TAG" -v bare="${RELEASE_TAG#v}" '
              $0 == "## " tag || $0 == "## " bare { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' RELEASE_NOTES.md)"
          fi
          {
            echo "## What changed"
            echo
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes"
              echo
              if [ -n "$previous" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${RELEASE_TAG}"
              else
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
              fi
            elif [ -n "$previous" ]; then
              git log --no-merges --reverse --pretty=format:"- %s" "${previous}..${RELEASE_TAG}"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${RELEASE_TAG}"
            else
              git log --no-merges --reverse --pretty=format:"- %s" "${RELEASE_TAG}"
            fi
          } > release-notes.md
          {
            echo
            echo "## Install notes"
            echo
            echo "- **Windows:** this installer is unsigned. SmartScreen may say “Windows protected your PC”; choose **More info → Run anyway**."
            echo "- **macOS:** this build is unsigned and not notarized. Right-click the app → **Open**, or allow it in **System Settings → Privacy & Security**."
            echo "- **Android:** the APK is signed with the stable Icyteru release key."
          } >> release-notes.md
          cat release-notes.md

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: icyteru-*
          path: artifacts
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
