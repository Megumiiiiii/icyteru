<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Icyteru</title>
    <script>
      try {
        var theme = localStorage.getItem('icyteru-theme') || 'system'
        var known = ['light', 'sakura', 'antartika', 'kraft', 'dark', 'abyss', 'github-light', 'github-dark', 'system']
        if (known.indexOf(theme) < 0) theme = 'system'
        var mode = theme === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'github-dark' : 'github-light')
          : theme
        document.documentElement.dataset.theme = mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
