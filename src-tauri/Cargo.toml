[package]
name = "icyteru-desktop"
version = "0.0.87"
edition = "2024"
rust-version = "1.90"

[lib]
name = "icyteru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.4.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "charset", "http2", "system-proxy"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "url"] }
futures-util = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
rand = "0.9"
base64 = "0.22"
zeroize = "1"
thiserror = "2"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
