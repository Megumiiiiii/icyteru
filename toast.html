<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icyteru notification</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #221a2d; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      body {
        font: 600 14px/1.4 "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
        color: #f4eef8;
      }
      .card {
        display: flex; align-items: center; gap: 10px;
        width: 100%; height: 100%; padding: 10px 14px;
        background: #221a2d;
        border: 1px solid #4a3a61;
        box-shadow: 0 16px 36px rgba(0, 0, 0, .45);
        cursor: pointer;
        user-select: none;
      }
      .card:hover { border-color: #8b7bb8; }
      .dot {
        flex: none; width: 34px; height: 34px; border-radius: 50%;
        display: grid; place-items: center;
        background: #8f8df7; color: #1d1a4a; font-weight: 800;
      }
      .text { min-width: 0; flex: 1 1 auto; }
      .title { font-size: 13px; letter-spacing: .02em; color: #cfc4e6; }
      .body {
        margin: 2px 0 0; font-size: 13px; font-weight: 500; color: #f4eef8;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .close {
        flex: none; width: 26px; height: 26px; border-radius: 50%;
        border: 0; background: transparent; color: #b9a9d6; font-size: 15px; cursor: pointer;
      }
      .close:hover { background: rgba(255, 255, 255, .1); color: #fff; }
    </style>
  </head>
  <body>
    <div class="card" id="card" role="status">
      <span class="dot" aria-hidden="true">I</span>
      <div class="text">
        <div class="title" id="title">Icyteru</div>
        <p class="body" id="body">New message</p>
      </div>
      <button class="close" id="close" type="button" aria-label="Dismiss">✕</button>
    </div>
    <script type="module" src="/src/toast.ts"></script>
  </body>
</html>
