appId: dev.megumii.icyteru
productName: Icyteru
copyright: Copyright © 2026 Megumiiiiii
directories:
  output: release
files:
  - dist/electron/**
  - dist/renderer/**
  - dist/shared/**
  - package.json
  - "!dist/shared/**/*.test.js"
  - "!**/*.map"
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
linux:
  maintainer: Megumiiiiii <Megumiiiiii@users.noreply.github.com>
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icons
mac:
  identity: null
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: build/icon.icns
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
